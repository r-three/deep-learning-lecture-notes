project:
  type: book
  output-dir: _site

book:
  title: "Neural Networks and Deep Learning"
  subtitle: "CSC413 / CSC2516 · University of Toronto — Fall 2026"
  author: ""
  date: "Fall 2026"
  search: true
  repo-url: https://github.com/r-three/csc413-2516-deep-learning-fall-2026
  repo-actions: [issue]
  sharing: [twitter, linkedin]
  sidebar:
    style: floating
    background: white
  chapters:
    - index.qmd
    - lectures/01-intro-regression.qmd
    - lectures/02-mlp-backprop.qmd
    - lectures/03-regularization.qmd
    - lectures/04-gradient-descent-adaptive-gradient-methods.qmd
    - lectures/05-convolutional-neural-networks-batch-layer-normalization-residual-connections.qmd
    - lectures/06-sequences-recurrent-neural-networks-and-sequence-to-sequence-learning.qmd
    - lectures/07-attention.qmd
    - lectures/08-transformers-part-1.qmd
    - lectures/09-transformers-part-2-large-language-models.qmd
    - lectures/10-architecture-grab-bag-part-1-lora-gnns-and-moes.qmd
    - lectures/11-architecture-grab-bag-part-2-transposed-convolution-unet-autoencoders-and-vaes.qmd
    - lectures/12-deep-learning-engineering-fairness-accountability-and-transparency.qmd

format:
  html:
    theme: cosmo
    css: styles/custom.css
    fontsize: 16px
    linestretch: 1.6
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    number-sections: false
    number-depth: 2
    smooth-scroll: true
    html-math-method: katex
    reference-section-title: "References"
    code-copy: true
    code-fold: false
    highlight-style: github
    fig-responsive: true
    link-external-newwindow: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,400&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">

execute:
  echo: false
  warning: false
  freeze: auto
